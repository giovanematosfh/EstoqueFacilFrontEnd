@if (totalCount() > 0) {
  <div class="pagination">
    <span class="pagination-info">
      Página {{ page() }} de {{ totalPages() }} ({{ totalCount() }}
      {{ totalCount() === 1 ? 'registro' : 'registros' }})
    </span>
    <div class="pagination-actions">
      <button class="btn btn-secondary" type="button" [disabled]="page() <= 1" (click)="previous()">
        Anterior
      </button>
      <button class="btn btn-secondary" type="button" [disabled]="page() >= totalPages()" (click)="next()">
        Próxima
      </button>
    </div>
  </div>
}
